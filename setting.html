<!DOCTYPE html>

<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel = "stylesheet" href="style3.css">

    </head>

    <body>

        <div class="container">
            <header>
                <div class="time-title">
                    <p>自主制作時計<span class="dli-clock"></span></p>
                </div>
            
                <button class="menu-button" id="menu-button">

                    <span></span>
                    <span></span>
                    <span></span>

                </button>

                <nav class="menu" id="menu">
                    <div class="setting">
                        <a href="setting.html">使い方</a>
                    </div>

                    <div class="main-time">
                        <a href="index.html">メイン画面</a>
                    </div>
                    
                    <div class="close-menu">
                        <button id="close-menu">メニューを閉じる</a>
                    </div>  
                </nav>

            </header>  
            
             <div class="main-wrapper">

                <h1>アラーム時計使い方</h1>

                <div class="f-main">
                    <div class="red-bar">
                    </div>
                    <div class="inform">
                        00と書かれた横のプルダウンをクリックして、アラーム時刻を選びます。
                        まだアラーム時刻設定は完了していません。
                    </div>
                </div>

                <div class="f-main">
                    <div class="red-bar">
                    </div>
                    <div class="inform">
                        アラーム時刻を選択した後に、アラーム追加ボタンを押します。時刻を変えて繰り返すと複数設定できます。設定したアラームは一覧の削除ボタンで取り消せます。
                    </div>
                </div>

                <div class="f-main">
                    <div class="red-bar">
                    </div>
                    <div class="inform">
                       指定した時刻になるとアラーム音が鳴ります。アラーム停止ボタンを押すと、アラームが鳴りやみます。他の待機中のアラームはそのまま残ります。各アラームは一度だけ鳴ります。ページを離れたり再読み込みすると設定は消えるため、この画面を開いたままにしてください。
                    </div>
                </div>

            </div> 

        </div>

               
    </body>

    <script src="script2.js"></script>
</html>
