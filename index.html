<body>

<div class="all-container">
    <div class="title-container">

        <!-- <div class="title">
            <h1>今の時刻</h1>
        </div> -->

    </div>

    <div class = "date-container">
        <p id="date-text">0000年00月00日0曜日</p>
    </div>

    <div class="time-container">
        <p id="realtime-clock">00 : 00 : 00</p>
    </div>

<div class="custom-time-picker">

    <select id="alarm-hour" aria-label="アラームの時">
        <option value="0">00</option>
        <option value="1">01</option>
        <option value="2">02</option>
        <option value="3">03</option>
        <option value="4">04</option>
        <option value="5">05</option>
        <option value="6">06</option>
        <option value="7">07</option>
        <option value="8">08</option>
        <option value="9">09</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>


        <!-- 23まで続ける -->
    </select>

    <span>:</span>

    <select id="alarm-minute" aria-label="アラームの分">
    <option value="0">00</option>
    <option value="5">05</option>
    <option value="10">10</option>
    <option value="15">15</option>
    <option value="20">20</option>
    <option value="25">25</option>
    <option value="30">30</option>
    <option value="35">35</option>
    <option value="40">40</option>
    <option value="45">45</option>
    <option value="50">50</option>
    <option value="55">55</option>
</select>

</div>


    <div class="alarm-container">
        
        <div class="alarm-button">
                <button id="set-button">アラーム追加</button>
                <button id="stop-button">アラーム停止</button>
        </div>
        
    </div>

</div>

</div>

<section class="alarm-list-container" aria-labelledby="alarm-list-title">
    <h2 id="alarm-list-title">設定したアラーム</h2>
    <p>各アラームは一度だけ鳴ります。ページを離れたり再読み込みすると設定は消えます。</p>
    <ul id="alarm-list"></ul>
</section>
<p id="alarm-message" role="status"></p>

<audio id="alarm-sound" src ="alarm.mp3"></audio>

<script src="script2.js"></script>
